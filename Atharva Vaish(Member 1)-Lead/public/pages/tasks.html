<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Pipeline - Campus Clone</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/animations.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .pipeline-container { display: flex; align-items: center; justify-content: space-between; overflow-x: auto; padding: 2rem 0; position: relative; }
        .pipeline-member { flex: 1; text-align: center; position: relative; z-index: 2; padding: 1rem; background: var(--bg-secondary, #111); border-radius: 12px; margin: 0 1rem; border: 1px solid transparent; transition: all 0.3s; }
        .pipeline-member.active { border-color: var(--accent-primary, #7C3AED); box-shadow: 0 0 15px rgba(124, 58, 237, 0.5); animation: pulse-border 2s infinite; }
        .pipeline-member .avatar { width: 60px; height: 60px; border-radius: 50%; background: var(--accent-primary, #7C3AED); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem; font-weight: bold; }
        .pipeline-arrow { flex: 0 0 50px; height: 2px; background: linear-gradient(90deg, transparent, var(--text-muted, #7D7D7D), transparent); position: relative; }
        .pipeline-arrow::after { content: '→'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--text-muted, #7D7D7D); font-size: 1.5rem; }
        .pipeline-arrow.flowing { background: linear-gradient(90deg, transparent, var(--accent-primary, #7C3AED), transparent); background-size: 200% 100%; animation: flow 2s linear infinite; }
        .pipeline-arrow.flowing::after { color: var(--accent-primary, #7C3AED); }
        @keyframes flow { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
        @keyframes pulse-border { 0% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(124, 58, 237, 0); } 100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); } }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .status-active { background-color: #22c55e; }
        .status-waiting { background-color: #eab308; }
        .status-idle { background-color: #6b7280; }
        .task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
        .task-card { background: var(--bg-secondary, #111); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; transition: transform 0.3s, box-shadow 0.3s; }
        .task-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .task-priority-High { border-left: 4px solid #ef4444; }
        .task-priority-Medium { border-left: 4px solid #eab308; }
        .task-priority-Low { border-left: 4px solid #22c55e; }
        .progress-dots { display: flex; gap: 4px; }
        .progress-dot { width: 10px; height: 10px; border-radius: 50%; background: #374151; }
        .progress-dot.completed { background: var(--accent-primary, #7C3AED); }
        .stats-bar { height: 8px; border-radius: 4px; background: #374151; display: flex; overflow: hidden; margin: 1rem 0; }
        .stats-segment { height: 100%; transition: width 0.3s ease; }
        .filter-tabs { display: flex; gap: 1rem; margin-bottom: 1rem; border-bottom: 1px solid #374151; padding-bottom: 0.5rem; }
        .filter-tab { background: none; border: none; color: var(--text-muted, #7D7D7D); cursor: pointer; padding: 0.5rem 1rem; font-size: 1rem; transition: color 0.3s; }
        .filter-tab.active { color: var(--text-primary, #fff); border-bottom: 2px solid var(--accent-primary, #7C3AED); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-primary, #090909); padding: 2rem; border-radius: 12px; width: 90%; max-width: 500px; border: 1px solid #374151; color: white;}
        .input-field { background: var(--bg-secondary, #111); color: white; border: 1px solid #333; padding: 0.5rem; border-radius: 4px; width: 100%; }
        .btn { padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; border: none; }
        .btn-primary { background: var(--accent-primary, #7C3AED); color: white; }
        .btn-secondary { background: #333; color: white; }
    </style>
</head>
<body class="bg-primary text-primary" style="background-color: var(--bg-primary, #090909); color: white; font-family: 'Inter', sans-serif;">
    <nav class="navbar" style="border-bottom: 1px solid #333; padding: 1rem;">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto;">
            <h1 class="text-xl font-bold" style="color: var(--accent-primary, #7C3AED);">Campus Clone</h1>
            <div style="display: flex; gap: 1rem;">
                <a href="tasks.html" style="color: white; text-decoration: none;">Tasks</a>
                <a href="settings.html" style="color: white; text-decoration: none;">Settings</a>
            </div>
        </div>
    </nav>

    <div class="container section" style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem;">
        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h1 class="text-3xl font-bold" style="background: linear-gradient(90deg, #7C3AED, #B5B5B5); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Task Pipeline</h1>
                <p style="color: var(--text-secondary, #B5B5B5); margin-top: 0.5rem;">Sequential workflow: Complete your task, pass it forward</p>
            </div>
            <button class="btn btn-primary" onclick="openCreateModal()" style="display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="plus"></i> Create Task
            </button>
        </div>

        <div class="pipeline-container" id="pipeline-container">
            <!-- Rendered via JS -->
        </div>

        <div style="margin-top: 3rem;">
            <h2 class="text-2xl font-bold mb-4">Work Distribution</h2>
            <div class="stats-bar" id="stats-bar">
                <!-- Rendered via JS -->
            </div>
            <div id="stats-labels" style="display: flex; justify-content: space-between; font-size: 0.875rem; color: var(--text-muted, #7D7D7D); margin-top: 0.5rem;">
                <!-- Rendered via JS -->
            </div>
        </div>

        <div style="margin-top: 3rem;">
            <div class="filter-tabs" id="filter-tabs">
                <button class="filter-tab active" data-filter="all">All Tasks</button>
                <button class="filter-tab" data-filter="my">My Tasks</button>
                <button class="filter-tab" data-filter="in-progress">In Progress</button>
                <button class="filter-tab" data-filter="completed">Completed</button>
            </div>
            
            <div class="task-grid" id="task-grid">
                <!-- Tasks rendered via JS -->
            </div>
        </div>
    </div>

    <!-- Create Task Modal -->
    <div class="modal" id="create-modal">
        <div class="modal-content">
            <h2 class="text-xl font-bold" style="margin-bottom: 1rem;">Create Task</h2>
            <p style="font-size: 0.875rem; color: var(--text-muted, #7D7D7D); margin-bottom: 1rem;">Tasks always start with Member 1 and flow sequentially</p>
            <form id="create-form">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem;">Title</label>
                    <input type="text" id="task-title" class="input-field" required>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; margin-bottom: 0.5rem;">Description</label>
                    <textarea id="task-desc" class="input-field" rows="3" required></textarea>
                </div>
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 0.5rem;">Priority</label>
                        <select id="task-priority" class="input-field">
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 0.5rem;">Due Date</label>
                        <input type="date" id="task-date" class="input-field" required>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('create-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Handoff Modal -->
    <div class="modal" id="handoff-modal">
        <div class="modal-content">
            <h2 class="text-xl font-bold" style="margin-bottom: 1rem;">Task Handoff</h2>
            <p id="handoff-msg" style="margin-bottom: 1rem;">Hand off [Task Name] to [Next Member]?</p>
            
            <div style="margin-bottom: 1rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" id="human-verify" class="checkbox-human" style="width: 1.25rem; height: 1.25rem;" onchange="toggleHandoffBtn()">
                    <span>I verify this work is complete and ready for handoff</span>
                </label>
            </div>
            
            <div style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem;">Handoff Notes (Optional)</label>
                <textarea id="handoff-notes" class="input-field" rows="2"></textarea>
            </div>
            
            <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
                <button type="button" class="btn btn-secondary" onclick="closeModal('handoff-modal')">Cancel</button>
                <button type="button" id="btn-confirm-handoff" class="btn btn-primary" style="opacity: 0.5; cursor: not-allowed;" disabled onclick="confirmHandoff()">Confirm Handoff</button>
            </div>
        </div>
    </div>

    <div id="toast-container" style="position: fixed; bottom: 1rem; right: 1rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 50;"></div>

    <script src="../js/tasks.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>

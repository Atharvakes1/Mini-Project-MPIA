<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Reels | Campus Clone</title>
    <!-- Fonts -->
                <!-- Styles -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/animations.css">
    <style>
        body, html {
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-primary);
        }

        .reels-wrapper {
            height: calc(100vh - 64px);
            padding-top: 64px;
            display: flex;
            justify-content: center;
            background-color: var(--bg-primary);
        }

        .reels-container {
            width: 100%;
            max-width: 450px; /* Mobile width */
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE and Edge */
            position: relative;
        }
        
        .reels-container::-webkit-scrollbar {
            display: none;
        }

        .reel-item {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            position: relative;
            background-color: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .reel-video-placeholder {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            /* Gradient set dynamically */
        }

        .reel-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 40%, transparent 100%);
            z-index: 2;
            pointer-events: none;
        }

        .reel-info {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 80px; /* Space for actions */
            z-index: 10;
            color: var(--text-primary);
        }

        .reel-creator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .creator-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--text-primary);
        }

        .creator-name {
            font-weight: 600;
            font-size: 1rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        
            font-family: var(--font-display);}

        .follow-btn {
            background: transparent;
            border: 1px solid var(--text-primary);
            color: var(--text-primary);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-left: 5px;
        }

        .reel-desc {
            font-size: 0.9rem;
            margin-bottom: 5px;
            line-height: 1.3;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .reel-tags {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        
            font-family: var(--font-mono);}

        .reel-music {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 12px;
            width: fit-content;
        }
        
        .music-icon {
            animation: spin 3s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .reel-actions {
            position: absolute;
            bottom: 20px;
            right: 15px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .reel-action-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: transform 0.2s;
        }

        .reel-action-btn:hover {
            transform: scale(1.1);
        }

        .reel-action-btn i {
            width: 32px;
            height: 32px;
        }

        .action-count {
            font-size: 0.8rem;
            font-weight: 600;
        
            font-family: var(--font-mono);}

        .liked i {
            fill: var(--accent-warm);
            color: var(--accent-warm);
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bookmarked i {
            fill: var(--accent-gold);
            color: var(--accent-gold);
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        /* Double tap heart animation */
        .floating-heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            color: var(--accent-warm);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
        }
        
        .floating-heart.animate {
            animation: likeHeart 0.8s ease-out forwards;
        }
        
        @keyframes likeHeart {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
            30% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -70%) scale(1.5); opacity: 0; }
        }

        /* Progress Bar */
        .progress-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.2);
            z-index: 20;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-primary);
            box-shadow: 0 0 5px var(--accent-primary);
        }
        
        .reel-item.playing .progress-bar {
            animation: progress 15s linear forwards;
        }

        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Upload FAB */
        .fab-upload {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-warm));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.5);
            z-index: 100;
            transition: all 0.3s;
        }
        
        .fab-upload:hover {
            transform: scale(1.1) rotate(90deg);
        }

        /* Upload Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--bg-secondary);
            width: 90%;
            max-width: 500px;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .upload-area {
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 8px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            margin-bottom: 20px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        
        .upload-area:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group input, .form-group textarea {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 10px;
            color: var(--text-primary);
            font-family: var(--font-body);
        }
        
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent-primary);
            color: var(--text-primary);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.9);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 30px;
            z-index: 300;
            transition: transform 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body style="background-color: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body);">
    <div class="reels-wrapper">
        <div class="reels-container" id="reelsContainer">
            <!-- Reels injected by JS -->
        </div>
    </div>

    <!-- Upload FAB -->
    <div class="fab-upload" id="uploadFab" title="Upload Reel">
        <i data-lucide="plus"></i>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <div class="modal-header">
                <span>Upload Reel</span>
                <button class="modal-close" id="closeModalBtn"><i data-lucide="x"></i></button>
            </div>
            <div class="upload-area">
                <i data-lucide="upload-cloud" style="width: 48px; height: 48px; margin-bottom: 10px;"></i>
                <span>Click to browse or drag video here</span>
            </div>
            <div class="form-group">
                <textarea rows="3" placeholder="Write a caption..."></textarea>
            </div>
            <div class="form-group">
                <input type="text" placeholder="Hashtags (e.g. #campus #fun)">
            </div>
            <button class="btn-submit ripple-effect">Share Reel</button>
        </div>
    </div>

    <div class="toast" id="toast">Link copied to clipboard!</div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/reels.js"></script>
    <script src="/js/navbar.js"></script>
</body>
</html>

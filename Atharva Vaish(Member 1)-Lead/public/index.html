<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Clone - MPIA</title>
  <meta name="description" content="Your entire college life, connected in one app. GL Bajaj Institute.">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/animations.css">
  <style>
    .splash-particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .splash-particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
    }
    .splash-particle.cyan {
      background: var(--accent-primary);
      box-shadow: 0 0 6px var(--accent-glow);
    }
    .splash-particle.warm {
      background: var(--accent-warm);
      box-shadow: 0 0 6px var(--accent-warm-glow);
    }
    .splash-particle.gold {
      background: var(--accent-gold);
    }
    .splash-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100px;
      height: 100px;
      border: 2px solid var(--accent-primary);
      border-radius: 50%;
      opacity: 0;
    }
    .splash-ring:nth-child(1) { animation: splashPulseRing 2s ease-out 1s forwards; }
    .splash-ring:nth-child(2) { animation: splashPulseRing 2s ease-out 1.3s forwards; border-color: var(--accent-warm); }
    .splash-ring:nth-child(3) { animation: splashPulseRing 2s ease-out 1.6s forwards; }
    .splash-glitch {
      animation: splashGlitch 0.3s ease 0.8s 2;
    }
    .splash-version {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      opacity: 0;
      animation: splashFade 0.4s ease 1.1s forwards;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .redirect-notice {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
      opacity: 0;
      animation: splashFade 0.3s ease 2s forwards;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .redirect-notice .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-light);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes splashPulseRing {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(3.5); opacity: 0; }
    }
    @keyframes splashGlitch {
      0%, 100% { text-shadow: none; }
      15% { text-shadow: -3px 0 #00D4FF, 3px 0 #FF6B35; }
      30% { text-shadow: 3px 0 #00D4FF, -3px 0 #FF6B35; }
      60% { text-shadow: -2px 2px #00D4FF, 2px -2px #FF6B35; }
    }
  </style>
</head>
<body>
  <div class="splash-screen" id="splashScreen">
    <div class="splash-ring"></div>
    <div class="splash-ring"></div>
    <div class="splash-ring"></div>
    <div class="splash-particles" id="splashParticles"></div>
    <div class="splash-logo splash-glitch text-gradient-mixed" id="splashLogo">Campus Clone</div>
    <div class="splash-subtitle">GL Bajaj Institute of Technology &amp; Management</div>
    <div class="splash-version">MPIA • Mini Project</div>
    <div class="splash-loader">
      <div class="splash-loader-bar"></div>
    </div>
    <div class="redirect-notice">
      <div class="spinner"></div>
      <span>Loading your campus experience...</span>
    </div>
  </div>

  <script>
    (function generateParticles() {
      const container = document.getElementById('splashParticles');
      const colors = ['cyan', 'warm', 'gold'];
      for (let i = 0; i < 35; i++) {
        const p = document.createElement('div');
        p.className = 'splash-particle ' + colors[i % 3];
        const x = Math.random() * 100, y = Math.random() * 100;
        const dx = (Math.random() - 0.5) * 220, dy = (Math.random() - 0.5) * 220;
        const delay = Math.random() * 2 + 0.5;
        const dur = Math.random() * 2 + 2;
        const size = Math.random() * 4 + 2;
        p.style.cssText = `left:${x}%;top:${y}%;width:${size}px;height:${size}px;--drift-x:${dx}px;--drift-y:${dy}px;animation:splashParticleDrift ${dur}s ease ${delay}s infinite;`;
        container.appendChild(p);
      }
    })();

    function playSplashSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o1 = ctx.createOscillator(), g1 = ctx.createGain();
        o1.type = 'sine';
        o1.frequency.setValueAtTime(500, ctx.currentTime);
        o1.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.3);
        g1.gain.setValueAtTime(0.12, ctx.currentTime);
        g1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        o1.connect(g1).connect(ctx.destination);
        o1.start(ctx.currentTime); o1.stop(ctx.currentTime + 0.5);
        const o2 = ctx.createOscillator(), g2 = ctx.createGain();
        o2.type = 'sine';
        o2.frequency.setValueAtTime(1400, ctx.currentTime + 0.2);
        o2.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime + 0.4);
        g2.gain.setValueAtTime(0.06, ctx.currentTime + 0.2);
        g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        o2.connect(g2).connect(ctx.destination);
        o2.start(ctx.currentTime + 0.2); o2.stop(ctx.currentTime + 0.6);
      } catch (_) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(playSplashSound, 300);
      setTimeout(() => {
        document.getElementById('splashScreen').classList.add('fade-out');
        setTimeout(() => {
          window.location.href = sessionStorage.getItem('campusUser') ? '/pages/home.html' : '/pages/login.html';
        }, 600);
      }, 3200);
    });

    document.getElementById('splashScreen').addEventListener('click', () => {
      document.getElementById('splashScreen').classList.add('fade-out');
      setTimeout(() => {
        window.location.href = sessionStorage.getItem('campusUser') ? '/pages/home.html' : '/pages/login.html';
      }, 400);
    });
  </script>
</body>
</html>
